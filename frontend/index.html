<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI Document Summarizer</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>


<body>

    <main class="container">

        <!-- Hero Section -->

        <section class="hero">

            <h1>
                AI Document Summarizer
            </h1>

            <p>
                Upload a document and get a concise summary instantly.
            </p>

        </section>


        <!-- Main Card -->

        <section class="card">

            <!-- Upload Area -->

            <div
                class="upload-area"
                id="uploadArea"
            >

                <div class="upload-icon">
                    📄
                </div>

                <h2>
                    Upload your document
                </h2>

                <p>
                    Supported formats: PDF, DOCX, TXT
                </p>


                <label
                    for="fileInput"
                    class="upload-button"
                >
                    Choose File
                </label>


                <input
                    type="file"
                    id="fileInput"
                    accept=".pdf,.docx,.txt"
                    hidden
                >


                <p id="fileName"></p>

            </div>


            <!-- Summarize Button -->

            <button
                id="summarizeButton"
                class="summarize-button"
                disabled
            >
                Summarize Document
            </button>


            <!-- Loading -->

            <div
                id="loading"
                class="loading hidden"
            >
                Processing document...
            </div>


            <!-- Result -->

            <div
                id="result"
                class="result hidden"
            >

                <h2>
                    Summary
                </h2>


                <div class="summary-box">

                    <p id="summaryText"></p>

                </div>


                <div class="document-info">

                    <span id="documentName"></span>

                    <span id="characterCount"></span>

                </div>

            </div>


            <!-- Error -->

            <div
                id="error"
                class="error hidden"
            ></div>

        </section>

    </main>


    <script src="/static/script.js"></script>

</body>

</html>
